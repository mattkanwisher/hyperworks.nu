<header class="site-header">
  <div class="inner">
    <a class="logo" href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
    <nav>
      <ul class="nav">
        {{ range .Site.Menus.main }}
        <li><a href="{{ .URL }}" {{ if $.IsMenuCurrent "main" . }}class="active"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>

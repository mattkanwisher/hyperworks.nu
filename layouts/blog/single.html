{{ define "main" }}
<article class="post-article">
  <header class="article-header wrap-blog-text">
    <h1>{{ .Title }}</h1>
    <div class="meta">{{ .Date.Format "January 2, 2006" }}</div>
    {{ with .Params.tags }}
    <div class="tag-row">{{ range . }}<span class="tag">{{ . }}</span>{{ end }}</div>
    {{ end }}
  </header>
  {{ with .Params.image }}
  <figure class="post-hero">
    <img src="{{ . }}" alt="" width="1600" height="900" fetchpriority="high">
  </figure>
  {{ end }}
  <div class="article-content wrap-blog-text">
    {{ .Content }}
  </div>
</article>
{{ end }}

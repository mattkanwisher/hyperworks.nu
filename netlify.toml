# Netlify + Route 53 hosting for hyperworks.nu
# https://docs.netlify.com/configure-builds/overview/

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  # Required: Netlify only installs Hugo when this is set (else exit 127).
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"
  # Use extended edition (SCSS, etc.) if needed later
  # NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Listing lives on /speaking/; keep /talks/<slug>/ detail pages
[[redirects]]
  from = "/talks"
  to = "/speaking/"
  status = 301
  force = true

[[redirects]]
  from = "/talks/"
  to = "/speaking/"
  status = 301
  force = true

# Netlify config for hyperworks.nu
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.164.0"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# Pretty URLs, security headers, force dark-friendly caching defaults
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SPA-style 404 not needed for pure static Hugo
[[redirects]]
  from = "/kanwisher.com/*"
  to = "/:splat"
  status = 301
